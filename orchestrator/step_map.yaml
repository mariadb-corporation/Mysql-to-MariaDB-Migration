# Map orchestrator phases to your existing shell scripts.
# Each step is:
#   id: stable id (used in state.json)
#   name: human readable
#   script: relative path from repo root
#   args: optional list of args

modes:
  one_step:
    - target_install
    - one_step_prepare
    - precheck_only
    - one_step
    - validate

  two_step:
    - target_install
    - two_step_prepare
    - precheck_only
    - two_step_schema
    - two_step_data
    - two_step_finalize
    - validate

  binlog:
    - binlog_prepare
    - precheck_only
    - binlog_seed
    - binlog_replication
    - binlog_verify

  inplace:
    - inplace_prepare
    - inplace_backup
    - inplace_install
    - inplace_upgrade
    - inplace_validate

  replace_slave:
    - replace_slave_prepare
    - precheck_only
    - replace_slave_backup
    - replace_slave_install
    - replace_slave_switch
    - binlog_seed
    - binlog_replication
    - binlog_verify
    - replace_slave_cleanup

  staged:
    # Offline two-phase: dump source → disk → load to target.
    # The dump/load/finalize scripts self-skip via STAGED_PHASE so a single
    # mode entry covers dump_and_load (default), dump_only, and load_only.
    # target_install no-ops via INSTALL_TARGET_MARIADB=0, which mariadb-migrator
    # forces for STAGED_PHASE=dump_only.
    - target_install
    - staged_prepare
    - staged_dump
    - staged_load
    - staged_finalize

phases:
  precheck_only:
    - id: precheck
      name: Precheck source variables and blockers
      script: scripts/00_precheck.sh
      args: []
  validate:
    - id: validate
      name: Validate after upgrade
      script: scripts/07_validate.sh
      args: []

  target_install:
    - id: install_target_mariadb
      name: Install MariaDB on target host
      script: scripts/23_install_mariadb.sh
      args: []

  one_step_prepare:
    - id: preflight_one_step
      name: Preflight checks (one_step)
      script: scripts/00_preflight_one_step.sh
      args: []

    - id: migrate_app_users
      name: Migrate application users to target (optional)
      script: scripts/09_migrate_app_users.sh
      args: []

  two_step_prepare:
    - id: preflight_two_step
      name: Preflight checks (two_step)
      script: scripts/00_preflight_two_step.sh
      args: []

  binlog_prepare:
    - id: preflight_binlog
      name: Preflight checks (binlog)
      script: scripts/00_preflight_binlog.sh
      args: []

  inplace_prepare:
    - id: preflight_inplace
      name: Preflight checks (inplace)
      script: scripts/00_preflight_inplace.sh
      args: []

  replace_slave_prepare:
    - id: preflight_replace_slave
      name: Preflight checks (replace_slave)
      script: scripts/20_preflight_replace_slave.sh
      args: []

  one_step:
    - id: one_step_dump_restore
      name: One-step dump/restore (mariadb-dump | mariadb)
      script: scripts/10_one_step_migration.sh
      args: []

  two_step_schema:
    - id: two_step_schema_only
      name: Export schema only (no data)
      script: scripts/11_two_step_schema.sh
      args: []

  two_step_data:
    - id: two_step_parallel_data
      name: Parallel data transfer with SQLines Data
      script: scripts/12_two_step_dispatch.sh
      args: []

  two_step_finalize:
    - id: two_step_finalize_objects
      name: Apply post-data DDL (triggers, routines, events)
      script: scripts/13_two_step_finalize.sh
      args: []

  binlog_seed:
    - id: binlog_seed_dump_restore
      name: Seed target with dump/restore snapshot
      script: scripts/14_binlog_seed.sh
      args: []

  binlog_replication:
    - id: binlog_start_replication
      name: Configure and start MariaDB replication from MySQL binlog
      script: scripts/15_binlog_start_replication.sh
      args: []

  binlog_verify:
    - id: binlog_verify_replication
      name: Verify replication status and lag
      script: scripts/16_binlog_verify.sh
      args: []

  inplace_backup:
    - id: inplace_backup
      name: Backup before in-place upgrade
      script: scripts/17_inplace_backup.sh
      args: []

  inplace_install:
    - id: inplace_install_mariadb
      name: Install MariaDB for in-place upgrade
      script: scripts/18_inplace_install_mariadb.sh
      args: []

  inplace_upgrade:
    - id: inplace_upgrade
      name: Execute in-place upgrade steps
      script: scripts/18_inplace_upgrade.sh
      args: []

  inplace_validate:
    - id: inplace_validate
      name: Validate in-place upgrade result
      script: scripts/19_inplace_validate.sh
      args: []

  replace_slave_backup:
    - id: replace_slave_backup
      name: Backup current MySQL slave host
      script: scripts/21_replace_slave_backup.sh
      args: []

  replace_slave_switch:
    - id: replace_slave_switch_engine
      name: Stop MySQL slave and start/configure MariaDB on same host
      script: scripts/22_replace_slave_switch_engine.sh
      args: []

  replace_slave_install:
    - id: replace_slave_install_mariadb
      name: Install MariaDB on target host
      script: scripts/23_install_mariadb.sh
      args: []

  replace_slave_cleanup:
    - id: replace_slave_cleanup_old_mysql
      name: Optional cleanup of old MySQL data on replaced slave host
      script: scripts/24_replace_slave_cleanup.sh
      args: []

  staged_prepare:
    - id: preflight_staged
      name: Preflight checks (staged)
      script: scripts/00_preflight_staged.sh
      args: []

  staged_dump:
    - id: staged_dump
      name: Dump source DB(s) to disk (mariadb-dump | pv | gzip)
      script: scripts/25_staged_dump.sh
      args: []

  staged_load:
    - id: staged_load
      name: Load dump file(s) into target (gunzip | pv | mariadb)
      script: scripts/26_staged_load.sh
      args: []

  staged_finalize:
    - id: staged_finalize
      name: Post-load sanity counts and manifest verification
      script: scripts/27_staged_finalize.sh
      args: []
