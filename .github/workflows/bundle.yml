name: Release bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v1.5.0)"
        required: true

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build bundle
        run: |
          NAME="MariaDB-migrator-${TAG#v}.tar.gz"
          git archive --format=tar.gz --prefix=MariaDB-migrator/ -o "$NAME" HEAD
          sha256sum "$NAME" > "$NAME.sha256"
          tar tzf "$NAME" | head

      - name: Attach to release
        run: gh release upload "$TAG" MariaDB-migrator-*.tar.gz* --clobber
