-- SQLines Data configuration file for the MySQL-to-MariaDB migration toolkit.
--
-- Sqldata looks for this file in the current directory at startup. Without it,
-- sqldata logs a non-fatal "Error reading the configuration file" warning.
-- Even an empty file silences that warning; the options below are the
-- migration-toolkit defaults.
--
-- Reference: https://sqlines.com/sqldata_cfg
-- Format:    -option=value, one per line. -- starts a comment.

-- Disable foreign-key checks at the SESSION level for every sqldata
-- connection. Avoids the parallel-load TRUNCATE race (error 1451) without
-- needing SET GLOBAL or SUPER privilege on the target. The bash-side
-- SET GLOBAL bracketing in 12_two_step_sqldata.sh remains as a belt-and-
-- suspenders fallback; both can coexist.
-mysql_set_foreign_key_checks=0
-ss=4
